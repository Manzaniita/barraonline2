version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: barraonline-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bo_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-local_migrator_secret_change_me}
      POSTGRES_DB: barraonline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "row_security=on"

volumes:
  pgdata:
